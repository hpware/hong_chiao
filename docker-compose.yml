services:
  redis:
    profiles: ["rate-limit"]
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  service:
    build: .
    ports:
      - "10419:3000"
    environment:
      API_URL: ${API_URL}
      NEXT_PUBLIC_SCHOOL_NAME: ${NEXT_PUBLIC_SCHOOL_NAME}
      WCFY_API_URL: ${WCFY_API_URL} # 給下載用的
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
      NEXT_PUBLIC_OWNER_EMAIL: ${NEXT_PUBLIC_OWNER_EMAIL}
      RATE_LIMIT_PROXY_SECRET: ${RATE_LIMIT_PROXY_SECRET:-}
      ENABLE_RATE_LIMIT: ${ENABLE_RATE_LIMIT:-false}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  service:
    image: ghcr.io/hpware/hong_chiao:latest
    ports:
      - "10419:3000"
    depends_on:
      redis:
        condition: service_healthy
    environment:
      API_URL: ${API_URL}
      NEXT_PUBLIC_SCHOOL_NAME: ${NEXT_PUBLIC_SCHOOL_NAME}
      WCFY_API_URL: ${WCFY_API_URL} # 給下載用的
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
      NEXT_PUBLIC_OWNER_EMAIL: ${NEXT_PUBLIC_OWNER_EMAIL}
      ENABLE_RATE_LIMIT: ${ENABLE_RATE_LIMIT:-false}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
